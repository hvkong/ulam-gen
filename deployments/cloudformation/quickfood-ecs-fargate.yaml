  # ============================================================
  # ECS SERVICES (all start with DesiredCount: 0)
  # ============================================================

  # --- CATALOG SERVICE ---
  ServiceCatalog:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: catalog
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefCatalog
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ClusterName
        Services:
          - PortName: catalog
            DiscoveryName: catalog
            ClientAliases:
              - Port: 3333
                DnsName: catalog

  # --- COPY SERVICE ---
  ServiceCopy:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: copy
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefCopy
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ClusterName
        Services:
          - PortName: copy
            DiscoveryName: copy
            ClientAliases:
              - Port: 3333
                DnsName: copy

  # --- RECOMMENDATIONS SERVICE ---
  ServiceRecommendations:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: recommendations
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefRecommendations
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ClusterName
        Services:
          - PortName: recommendations
            DiscoveryName: recommendations
            ClientAliases:
              - Port: 3333
                DnsName: recommendations

  # --- WS SERVICE ---
  ServiceWs:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: ws
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefWs
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ClusterName
        Services:
          - PortName: ws
            DiscoveryName: ws
            ClientAliases:
              - Port: 3333
                DnsName: ws

  # --- CONFIG SERVICE ---
  ServiceConfig:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: config
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefConfig
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ClusterName
        Services:
          - PortName: config
            DiscoveryName: config
            ClientAliases:
              - Port: 3333
                DnsName: config

  # --- GRPC SERVICE ---
  ServiceGrpc:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: grpc
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefGrpc
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ClusterName
        Services:
          - PortName: grpc
            DiscoveryName: grpc
            ClientAliases:
              - Port: 3334
                DnsName: grpc

  # --- PUBLIC-API SERVICE (attached to ALB) ---
  ServicePublicApi:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: public-api
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefPublicApi
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: public-api
          ContainerPort: 3333
          TargetGroupArn: !Ref ALBTargetGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ClusterName
        Services:
          - PortName: public-api
            DiscoveryName: public-api
            ClientAliases:
              - Port: 3333
                DnsName: public-api

# ============================================================
# OUTPUTS
# ============================================================
Outputs:
  ALBDnsName:
    Description: >
      Application Load Balancer DNS name. Use this URL to access the QuickFood app.
      Add this to Grafana Cloud Faro Allowed Origins for frontend observability.
    Value: !GetAtt ALB.DNSName

  ALBUrl:
    Description: "Full URL to access QuickFood (HTTPS)"
    Value: !Sub "https://${ALB.DNSName}"

  ECSClusterName:
    Description: "ECS Cluster name — use with aws ecs update-service to scale up"
    Value: !Ref ECSCluster

  ECSClusterArn:
    Description: "ECS Cluster ARN"
    Value: !GetAtt ECSCluster.Arn

  ScaleUpCommand:
    Description: >
      Run this command to scale all services to 1 task each.
      Replace the region if needed.
    Value: !Sub >
      for svc in public-api catalog copy recommendations ws config grpc; do
        aws ecs update-service --cluster ${ClusterName} --service $svc --desired-count 1 --region ${AWS::Region};
      done

  ScaleDownCommand:
    Description: "Run this command to scale all services back to 0."
    Value: !Sub >
      for svc in public-api catalog copy recommendations ws config grpc; do
        aws ecs update-service --cluster ${ClusterName} --service $svc --desired-count 0 --region ${AWS::Region};
      done

  TaskExecutionRoleArn:
    Description: "Task Execution Role ARN (for reference)"
    Value: !GetAtt ECSTaskExecutionRole.Arn

  TaskRoleArn:
    Description: "Task Role ARN (for reference)"
    Value: !GetAtt ECSTaskRole.Arn
